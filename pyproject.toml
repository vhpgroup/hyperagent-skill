[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hsmt-engine"
version = "0.1.0"
description = "Durable HSMT extraction, product matching, review, and Excel export service"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115",
  "httpx>=0.27",
  "langgraph>=1.0",
  "langgraph-checkpoint-sqlite>=2.0",
  "python-multipart>=0.0.9",
  "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.24"]

[project.scripts]
hsmt-engine = "hsmt_engine.cli:main"

[tool.setuptools.packages.find]
include = ["hsmt_engine*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
